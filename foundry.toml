[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.31"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = true
verbosity = 2
fuzz = { runs = 256, max_test_rejects = 65536 }
invariant = { runs = 256, depth = 256, fail_on_revert = false }

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 1000, depth = 500 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

[doc]
out = "docs"

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
sepolia = "${SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
base_sepolia = { key = "${BASESCAN_API_KEY}" }
